[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.15.3", features = ["bevy_winit", "bevy_render", "bevy_ui"] }
accesskit = "0.17.1"
bevy_a11y = "0.15.3"
bevy_simple_text_input = "0.10.2"
rfd = "0.15.3"
winit = "0.30.9"
game_engine = { path = "../game_engine" }
tournament_engine = { path = "../tournament_engine" }
game_history = { path = "../game_history" }
ai_manager = { path = "../ai_manager" }

# Pull in `board` *with* its Serde support:
board = { path = "../board", default-features = false, features = ["with-serde"] }

[features]
bevy_dev_tools = ["bevy/bevy_winit", "bevy/bevy_render"]