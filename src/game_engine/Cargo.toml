[package]
name = "game_engine"
version = "0.1.0"
edition = "2024"

[dependencies]

# If you're sending & receiving Board via JSON, enable board’s serde feature:
board         = { path = "../board", default-features = false, features = ["with-serde"] }

# JSON support
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

# Process timeout support
wait-timeout  = "0.2"

crossbeam = "0.8" # Multi threading processing for ai
libloading = "0.8"
game_history = { path = "../game_history" }